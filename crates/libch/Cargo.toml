[package]
name = "libch"
description = "ClickHouse's insert and merge as short-lived operations on BigHouse `inodedb` disks, so one pool of workers serves many tenants."
# The version the release workflow bumps (RELEASING.md).
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["clickhouse", "analytics", "mergetree", "multitenant", "s3"]
categories = ["database"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
bytes.workspace = true
futures-util.workspace = true
inodedb.workspace = true
libc.workspace = true
metrics = { workspace = true, optional = true }
prost.workspace = true
rand.workspace = true
reqwest.workspace = true
rusty-s3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
url.workspace = true

[dev-dependencies]
# The crate itself with every feature, so `cargo test` runs the tests of `libch::metrics`.
libch = { workspace = true, features = ["metrics"] }
libch-testkit.workspace = true
metrics-util.workspace = true

[features]
# `libch::metrics`: an observer that records each operation through the `metrics` crate's facade.
metrics = ["dep:metrics"]

[[bench]]
name = "stock"
harness = false

[[bench]]
name = "operations"
harness = false
