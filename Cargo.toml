[workspace]
resolver = "3"
members = ["crates/libch", "crates/libch-testkit", "demo"]

# What the crates share. `libch` sets its own version and is the one crate published.
[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/danthegoodman1/libch"
publish = false

[workspace.dependencies]
libch = { path = "crates/libch" }
libch-testkit = { path = "crates/libch-testkit" }

# InodeDB's Rust client. It speaks the protocol of the InodeDB server at `inodedb.rev`, the commit BigHouse pins
# its `inodedb` submodule to, which the dev stack runs and the preflight checks.
inodedb = { package = "inodedb-client", version = "0.1" }

bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
libc = "0.2"
metrics = "0.24"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
prost = "0.14"
prost-build = "0.14"
rand = "0.9"
reqwest = { version = "0.12", default-features = false }
rusty-s3 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14", default-features = false }
url = "2"
